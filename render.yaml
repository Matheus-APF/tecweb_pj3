databases:
  - name: taskpilot-db
    databaseName: taskpilot
    user: taskpilot
    plan: free
    region: ohio

services:
  - type: web
    name: taskpilot-pj3-api
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/status/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskpilot-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_ENABLED
        value: "true"

  - type: web
    name: taskpilot-pj3-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: taskpilot-pj3-api
          envVarKey: RENDER_EXTERNAL_URL
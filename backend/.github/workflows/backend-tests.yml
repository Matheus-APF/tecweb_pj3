name: Backend tests
on:
  push:
    branches: [main, dev, deploy]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-only-secret-key-not-for-production
      DJANGO_DEBUG: 'False'
      GEMINI_API_KEY: ''
      RUN_GEMINI_LIVE: '0'
      AI_ENABLED: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run Django tests
        working-directory: backend
        run: python manage.py test users projects ai --verbosity 2
